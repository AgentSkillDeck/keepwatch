[package]
name = "keepwatch"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Keep your computer awake for AI coding agents, and check power, agents, ports, mic and camera (Linux and Windows)."
publish = false
rust-version = "1.88"

[[bin]]
name = "keepwatch"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_Foundation"] }
winreg = "0.56.0"
