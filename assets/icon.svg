<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Keepwatch app icon. Original artwork (agentskilldeck contributors, Apache-2.0).
       An eye whose upper lid is a laptop lid: the Mac keeps watch with the lid closed. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1B2463"/>
      <stop offset="0.55" stop-color="#0E1640"/>
      <stop offset="1" stop-color="#060A1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.46">
      <stop offset="0" stop-color="#2FE6CF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2FE6CF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2FE6CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#9BFFF0"/>
      <stop offset="0.45" stop-color="#22C9D2"/>
      <stop offset="1" stop-color="#0A4F86"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F6FF"/>
      <stop offset="1" stop-color="#A9B4D3"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4F7"/>
    </linearGradient>
    <clipPath id="eyeClip">
      <path d="M244 566 C370 418 654 418 780 566 C654 704 370 704 244 566 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- eye -->
  <path d="M244 566 C370 418 654 418 780 566 C654 704 370 704 244 566 Z" fill="url(#white)"/>
  <g clip-path="url(#eyeClip)">
    <circle cx="512" cy="566" r="132" fill="#2FE6CF" opacity="0.5" filter="url(#soft)"/>
    <circle cx="512" cy="566" r="116" fill="url(#iris)"/>
    <circle cx="512" cy="566" r="116" fill="none" stroke="#063A63" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="512" cy="566" r="50" fill="#060A1E"/>
    <circle cx="548" cy="528" r="21" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="478" cy="604" r="8" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- laptop lid as the upper eyelid -->
  <path d="M214 552 C350 368 674 368 810 552" fill="none" stroke="url(#metal)" stroke-width="46" stroke-linecap="round"/>
  <!-- laptop base under the eye, with the front lip -->
  <rect x="236" y="736" width="552" height="34" rx="17" fill="url(#metal)"/>
  <rect x="456" y="736" width="112" height="12" rx="6" fill="#0E1640" opacity="0.35"/>

  <!-- awake status light -->
  <circle cx="770" cy="310" r="30" fill="#2FE6CF"/>
  <circle cx="770" cy="310" r="52" fill="#2FE6CF" opacity="0.18"/>
</svg>
