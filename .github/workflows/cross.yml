name: cross
on:
  push:
    paths: ["cross/**", ".github/workflows/cross.yml"]
  pull_request:
    paths: ["cross/**", ".github/workflows/cross.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: cross
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: keepwatch-linux-x86_64
            binary: keepwatch
          - os: windows-latest
            artifact: keepwatch-windows-x86_64.exe
            binary: keepwatch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke test
        shell: bash
        run: |
          bin=target/release/${{ matrix.binary }}
          "$bin" version
          "$bin" status --json
          "$bin" agents --json
          "$bin" ports --json
      # Linux ships a static (musl) build, so it runs on any x86_64 distribution,
      # not only ones with the runner's glibc.
      - name: Static Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/keepwatch version
          file target/x86_64-unknown-linux-musl/release/keepwatch | grep -q 'static'
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          src=target/release/${{ matrix.binary }}
          if [ "$RUNNER_OS" = Linux ]; then src=target/x86_64-unknown-linux-musl/release/keepwatch; fi
          cp "$src" dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cross/dist/${{ matrix.artifact }}
          if-no-files-found: error
